# Weekly, gentle check of outbound source links (one request a second, a sample that changes each
# week). Report-only: results go to the job summary. Sites that refuse automated requests are
# listed as "refused", never worked around.
name: Weekly link check

on:
  schedule:
    - cron: "41 10 * * 6"   # Saturday 10:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m impactline.linkcheck
